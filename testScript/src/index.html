<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TS Test</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <section class="order">
      <div class="order__window">
        <div class="order_window_header">
          <img src="assets/hh.svg" />
        </div>
        <div class="order_group">
          <h1>Оформить заказ</h1>

          <button class="order__group_btn" type="button">Оформить</button>
        </div>
      </div>
      <div class="popup__order" role="dialog" aria-modal="true" aria-labelledby="popup-title">
        <div class="popup__backdrop" data-close></div>
        <div class="popup__window">
          <div class="popup__order_header">
            <img src="assets/hh.svg" alt="logo" />
            <span class="popup__close" role="button" tabindex="0" aria-label="Закрыть"></span>
          </div>
          <div class="popup__order_content">
            <h1 id="popup-title">Заказ удачно оформлен</h1>
            <p>Мы подготовили подтверждение и скоро доставим все детали.</p>
          </div>
        </div>
      </div>
    </section>

    <script type="module" src="./script.ts"></script>
  </body>
</html>
